name: SonarCloud
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-scan:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        # Épinglé à la version v4.4.0
        uses: actions/checkout@11d59601502504298d249b66e22bc6d6531d011d 
        with:
          fetch-depth: 0

      - name: Set up Python
        # Épinglé à la version v5.5.0
        uses: actions/setup-python@8d9ed9ab9219b1bf4a92c30da9a4b087091ccb35 
        with:
          python-version: '3.10'

      - name: Install Tools, Convert Notebooks & Run Tests
        run: |
          # 1. Installation de jupytext ET des outils de couverture/test
          pip install --only-binary :all: jupytext==1.16.4 pytest pytest-cov
          
          # 2. Conversion des notebooks en scripts .py pour que pytest et SonarCloud puissent les lire
          find . -name "*.ipynb" -exec jupytext --to py {} \;
          
          # 3. Exécution des tests et génération du rapport obligatoire coverage.xml
          pytest --cov=. --cov-report=xml:coverage.xml

      - name: Cache SonarCloud packages
        # Épinglé à la version v4.2.0 (recommandée pour la sécurité)
        uses: actions/cache@d4323d4df104b026a6e56904bb56e8d2e53b1b44 
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        # Épinglé à la version v5.3.1 (inclut le correctif de sécurité officiel)
        uses: SonarSource/sonarqube-scan-action@4a572a1e0642878cf7d8ba154687e14fb1e68be5 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Requis par l'action pour lier les PRs
        with:
          # Configuration indispensable pour injecter la couverture de code dans SonarCloud
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/*_test.py
