name: SonarCloud
on:
  push:
    branches:
      - main
      - Develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar-scan:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        # Épinglé à la version officielle v4.2.2
        uses: actions/checkout@11d59601502504298d249b66e22bc6d6531d011d 
        with:
          fetch-depth: 0

      - name: Set up Java
        # Épinglé à la version officielle v4.5.0
        uses: actions/setup-java@8a44e8436356552299ec510d7595e672132711be
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        # Épinglé à la version officielle v5.3.0
        uses: actions/setup-python@0b93645e9fa290fc2ebd38ae5ff5e83428d9473e 
        with:
          python-version: '3.10'

      - name: Install Tools, Convert Notebooks & Run Tests
        run: |
          pip install jupytext==1.16.4 pytest pytest-cov pyspark
          find . -name "*.ipynb" -exec jupytext --to py {} \;
          pytest --continue-on-collection-errors --cov=. --cov-report=xml:coverage.xml || echo "Avertissement de découverte ignoré"

      - name: Cache SonarCloud packages
        # Épinglé à la version officielle v4.2.2
        uses: actions/cache@1bd1e32a3bdc453d159583a534c442cf29e578c7 
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        # Épinglé à la version officielle v3.1.0 (Résout l'alerte githubactions:S7637)
        uses: SonarSource/sonarcloud-github-action@e300976159556fa38b2585fbc70f5e1f0e4b09b4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT
            -Dsonar.organization=kacidatabricks-dotcom
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/*_test.py,**/*.py
