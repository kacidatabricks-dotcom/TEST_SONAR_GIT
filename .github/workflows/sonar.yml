name: SonarCloud
on:
  push:
    branches:
      - main
      - Develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar-scan:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools, Convert Notebooks & Run Tests
        run: |
          # Le paramètre --only-binary a été retiré ici pour autoriser l'installation de pyspark
          pip install jupytext==1.16.4 pytest pytest-cov pyspark
          find . -name "*.ipynb" -exec jupytext --to py {} \;
          pytest --cov=. --cov-report=xml:coverage.xml || echo "Pas de tests exécutés ou erreur ignorée"

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT
            -Dsonar.organization=kacidatabricks-dotcom
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/*_test.py
