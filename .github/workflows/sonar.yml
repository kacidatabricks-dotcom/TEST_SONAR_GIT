
name: SonarCloud

on:
  push:
    branches:
      - main
      - Develop

  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar-scan:
    name: Tests and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du dépôt GitHub
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installation de Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # 3. Installation de Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # 4. Installation des dépendances
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 5. Vérification de la structure du projet
      - name: Check project structure
        run: |
          echo "=== SRC ==="
          ls -la TEST_SONAR_GIT/SRC

          echo "=== TESTS ==="
          ls -la TEST_SONAR_GIT/TESTS

      # 6. Exécution des tests et génération du rapport
      - name: Run Tests and Coverage
        run: |
          python -m pytest \
            -o "python_files=SONAR_TEST_*.py test_*.py *_test.py" \
            --continue-on-collection-errors \
            --cov=TEST_SONAR_GIT/SRC \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            TEST_SONAR_GIT/TESTS

      # 7. Vérification du rapport de couverture
      - name: Check Coverage Report
        run: |
          test -f coverage.xml
          echo "Coverage report generated successfully"

      # 8. Cache SonarCloud
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      # 9. Analyse SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
