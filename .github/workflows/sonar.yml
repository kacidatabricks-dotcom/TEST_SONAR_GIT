name: SonarCloud
on:
  push:
    branches:
      - main
      - Develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar-scan:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools, Convert Notebooks & Run Tests
        run: |
          # 1. Installation des outils de conversion, couverture et spark
          pip install jupytext==1.16.4 coverage pyspark
          
          # 2. Conversion du notebook (.ipynb) en script Python (.py)
          find . -name "*.ipynb" -exec jupytext --to py {} \;
          
          # 3. Exécution de unittest enveloppé par coverage pour suivre l'exécution
          # Découvre et exécute automatiquement les classes Test dans les fichiers convertis
          coverage run -m unittest discover -s . -p "*.py" || echo "Pas de tests exécutés ou erreur ignorée"
          
          # 4. Génération du fichier XML pour SonarCloud
          coverage xml -o coverage.xml

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT
            -Dsonar.organization=kacidatabricks-dotcom
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/*_test.py
