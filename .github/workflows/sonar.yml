
name: SonarCloud

on:
  push:
    branches:
      - main
      - Develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar-scan:
    name: Tests and SonarCloud Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      PYTHONPATH: ${{ github.workspace }}/TEST_SONAR_GIT/SRC:${{ github.workspace }}/TEST_SONAR_GIT/TESTS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Debug project structure
        run: |
          echo "=== Répertoire courant ==="
          pwd
          echo "=== Contenu de la racine GitHub ==="
          ls -la
          echo "=== Recherche du dossier SRC ==="
          find . -type d -name SRC
          echo "=== Recherche du dossier TESTS ==="
          find . -type d -name TESTS
          echo "=== Recherche du conftest.py ==="
          find . -type f -name conftest.py

      
      - name: Run PySpark tests and coverage
        run: |
          python -m pytest \
            TEST_SONAR_GIT/TESTS \
            --continue-on-collection-errors \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing


      - name: Verify coverage report
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERREUR : coverage.xml absent"
            exit 1
          fi

          echo "=== Taille du rapport ==="
          ls -lh coverage.xml

          echo "=== Début du rapport XML ==="
          head -n 20 coverage.xml

          echo "=== Sources déclarées ==="
          grep -n "<source>" coverage.xml

          echo "=== Fichiers déclarés ==="
          grep -n "<class " coverage.xml | head -n 10
          head -n 12 coverage.xml

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT
            -Dsonar.organization=kacidatabricks-dotcom
            -Dsonar.python.coverage.reportPaths=coverage.xml
