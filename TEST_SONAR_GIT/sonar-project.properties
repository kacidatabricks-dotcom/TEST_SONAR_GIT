#sonar.python.coverage.reportPaths=coverage.xml
#sonar.sourceEncoding=UTF-8




# ============================================================
# IDENTIFICATION DU PROJET SONARCLOUD
# ============================================================

sonar.organization=kacidatabricks-dotcom

sonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT

sonar.projectName=Databricks Free Notebooks


# ============================================================
# SOURCES ET TESTS
# ============================================================

sonar.sources=SRC

sonar.tests=TESTS

sonar.test.inclusions=**/SONAR_TEST_*.py,**/test_*.py,**/*_test.py

sonar.exclusions=**/*.ipynb,**/__pycache__/**,**/.ipynb_checkpoints/**


# ============================================================
# PYTHON
# ============================================================

sonar.python.version=3.10


# ============================================================
# COUVERTURE DES TESTS
# ============================================================

sonar.python.coverage.reportPaths=coverage.xml



- name: Vérifier les fichiers SRC
  run: |
    echo "=== Fichiers disponibles dans SRC ==="
    ls -la TEST_SONAR_GIT/SRC


