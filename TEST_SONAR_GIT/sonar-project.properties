#sonar.projectKey=abassurance-databricks-bloc3
#sonar.projectName=AbAssurance Databricks Bloc 3
#sonar.sources=PIPELINE
#sonar.tests=tests
#sonar.python.coverage.reportPaths=coverage.xml
#sonar.sourceEncoding=UTF-8

- name: Installer les dépendances
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt

- name: Lancer les tests
  run: |
    pytest TEST_SONAR_GIT/TESTS --cov=TEST_SONAR_GIT/PIPELINE --cov-report=xml



# ============================================================
# IDENTIFICATION DU PROJET SONARCLOUD
# ============================================================

sonar.organization=kacidatabricks-dotcom

sonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT

sonar.projectName=Databricks Free Notebooks


# ============================================================
# SOURCES ET TESTS
# ============================================================

sonar.sources=PIPELINE

sonar.tests=TESTS

sonar.test.inclusions=**/SONAR_TEST_*.py,**/test_*.py,**/*_test.py

sonar.exclusions=**/*.ipynb,**/__pycache__/**,**/.ipynb_checkpoints/**


# ============================================================
# PYTHON
# ============================================================

sonar.python.version=3.10


# ============================================================
# COUVERTURE DES TESTS
# ============================================================

sonar.python.coverage.reportPaths=coverage.xml



- name: Vérifier les fichiers PIPELINE
  run: |
    echo "=== Fichiers disponibles dans PIPELINE ==="
    ls -la TEST_SONAR_GIT/PIPELINE


