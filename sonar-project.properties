# ============================================================
# CONFIGURATION DU PROJET SONARCLOUD
# ============================================================

sonar.organization=kacidatabricks-dotcom

# IMPORTANT :
# Cette clé doit être exactement celle de ton projet SonarCloud.
sonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT

sonar.projectName=Databricks Free Notebooks
sonar.projectVersion=1.0

# ============================================================
# SOURCES PYTHON
# ============================================================

sonar.sources=TEST_SONAR_GIT/SRC

# Exclusions des fichiers non destinés à l'analyse du code source
sonar.exclusions=**/*.ipynb,**/__pycache__/**,**/.pytest_cache/**,**/venv/**,**/.venv/**

# ============================================================
# TESTS PYTHON
# ============================================================

sonar.tests=TEST_SONAR_GIT/TESTS

# Fichiers de tests
sonar.test.inclusions=**/SONAR_TEST_*.py,**/test_*.py,**/*_test.py

# ============================================================
# RAPPORT DE COUVERTURE
# ============================================================

sonar.python.coverage.reportPaths=coverage.xml

# ============================================================
# ENCODAGE
# ============================================================

sonar.sourceEncoding=UTF-8


