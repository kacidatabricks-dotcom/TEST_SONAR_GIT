# ============================================================
# CONFIGURATION DU PROJET SONARCLOUD
# ============================================================

sonar.organization=kacidatabricks-dotcom
sonar.projectKey=kacidatabricks-dotcom_TEST_SONAR_GIT
sonar.projectName=Databricks Free Notebooks
sonar.projectVersion=1.0

# ============================================================
# SOURCES ET TESTS
# ============================================================

sonar.sources=TEST_SONAR_GIT/SRC
sonar.tests=TEST_SONAR_GIT/TESTS

# Fichiers de tests
sonar.test.inclusions=**/SONAR_TEST_*.py

# Exclusions des fichiers non pertinents
sonar.exclusions=**/*.ipynb,**/__pycache__/**,**/.pytest_cache/**,**/conftest.py

# ============================================================
# PYTHON
# ============================================================

sonar.python.version=3.10

# ============================================================
# RAPPORT DE COUVERTURE
# ============================================================

sonar.python.coverage.reportPaths=coverage.xml

# ============================================================
# ENCODAGE
# ============================================================

sonar.sourceEncoding=UTF-8
